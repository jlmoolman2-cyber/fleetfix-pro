# Staging-specific Firebase App Hosting configuration.
# This file overrides matching values from apphosting.yaml when the backend Environment name is staging.
runConfig:
  minInstances: 0

env:
  - variable: COMMUNICATION_EXECUTION_ENABLED
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  - variable: FLEETFIX_ENVIRONMENT
    value: "staging"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FLEETFIX_ENVIRONMENT
    value: "staging"
    availability: [BUILD, RUNTIME]

  # Registered fleetfix-pro-staging Web App values. These are public Firebase
  # client settings, not Secret Manager secrets.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBvlGk21WCly5rkaeedLLRB7eblYXit0cc"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "fleetfix-pro-staging.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "fleetfix-pro-staging"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "fleetfix-pro-staging.firebasestorage.app"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "764335805140"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:764335805140:web:26356282489d5ab2e3e141"
    availability: [BUILD, RUNTIME]

  # IQ200 hosted reasoning remains closed for this readiness deployment.
  - variable: IQ200_REASONING_ENABLED
    value: "false"
    availability: [RUNTIME]
  - variable: IQ200_HOSTED_PROVIDER_ENABLED
    value: "false"
    availability: [RUNTIME]
  - variable: IQ200_PHASE7_COMMISSIONING_ENABLED
    value: "false"
    availability: [RUNTIME]

  - variable: META_APP_SECRET
    secret: metaAppSecret
    availability: [RUNTIME]
  - variable: META_WHATSAPP_ACCESS_TOKEN
    secret: metaWhatsappAccessToken
    availability: [RUNTIME]
  - variable: META_WEBHOOK_VERIFY_TOKEN
    secret: metaWebhookVerifyToken
    availability: [RUNTIME]
  - variable: META_WHATSAPP_PHONE_NUMBER_ID
    value: "1092582317262224"
    availability: [RUNTIME]
  - variable: META_GRAPH_API_VERSION
    value: "v25.0"
    availability: [RUNTIME]
  - variable: WHATSAPP_WEBHOOK_PUBLIC_URL
    value: "https://fleetfix-pro-staging--fleetfix-pro-staging.europe-west4.hosted.app/api/whatsapp/webhook"
    availability: [RUNTIME]
  - variable: WHATSAPP_ALLOW_META_READ_PROBE
    value: "false"
    availability: [RUNTIME]
  - variable: WHATSAPP_MEDIA_WORKER_SECRET
    secret: whatsappMediaWorkerSecret
    availability: [RUNTIME]
  - variable: WHATSAPP_MEDIA_RETENTION_DAYS
    value: "0"
    availability: [RUNTIME]

